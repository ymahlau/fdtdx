version: 2

# All ecosystems are bundled into a single PR, opened on the 1st and 15th of each month.
multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "cron"
      cronjob: "0 6 1,15 * *"
      timezone: "Europe/Berlin"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "uv"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "pre-commit"
    directory: "/"
    multi-ecosystem-group: "all-dependencies"
    patterns: ["*"]
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
