notebooks/quickstart/01_jax_introduction:
  emoji: "🚀"
  title: "Introduction to JAX"
  description: >
    New to JAX? Start here. Learn the basics of high-performance array
    computing, automatic differentiation, and how it powers FDTDX.

notebooks/quickstart/02_basic_materials:
  emoji: "🎨"
  title: "Basic Materials"
  description: >
    Discover how to define physical materials. Learn about different
    material types and their differences.

notebooks/quickstart/03_object_placement_guide:
  emoji: "🏗️"
  title: "Object Placement Guide"
  description: >
    This guide covers how to programmatically position, orient, and
    manage objects in your simulation scene.

notebooks/quickstart/04_basic_simulation:
  emoji: "⚙️"
  title: "Basic Simulation"
  description: >
    Bring it all together. Set up your simulation scene, step through
    time, and run your first simulation.

notebooks/physics/01_maxwell:
  title: "Maxwell's Equations"
  description: "Learn about the fundamental electromagnetic equations."

notebooks/physics/02_fdtd:
  title: "FDTD"
  description: >
    Learn how the fundamental physics is realized in a numerical
    finite-difference time-domain simulation.

notebooks/components/01_uniform_plane_source:
  title: "Uniform Plane Source"
  description: "Learn how to inject uniform plane waves into your simulation domain."

notebooks/components/02_mode_source_detector:
  title: "Mode Source & Detector"
  description: "Explore how to inject and measure specific guided optical modes."

notebooks/advanced/01_2d_simulation:
  title: "2D Simulation"
  description: >-
    Learn how to set up and run two-dimensional simulations within the
    3D-Framework